name: Feature or task
description: A feature, improvement or task to plan
labels: ["feature"]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What should be possible once this is done, and why?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Desktop app
        - Library / scan
        - Playback
        - Extensions
        - Control API
        - Mobile app
        - CI / packaging
        - Documentation
    validations:
      required: true
  - type: checkboxes
    id: quality
    attributes:
      label: Quality requirements
      options:
        - label: Needs tests
        - label: Needs documentation
        - label: Has accessibility impact
  - type: textarea
    id: notes
    attributes:
      label: Notes
